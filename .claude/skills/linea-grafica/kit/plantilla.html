<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plantilla — DP World</title>
<!-- Tema antes de pintar: lee la preferencia guardada; el valor por defecto de cada app va al final ('dark' o 'light') -->
<script>(function(){var t;try{t=localStorage.getItem('dpw_tema')}catch(e){}document.documentElement.setAttribute('data-theme',t==='light'||t==='dark'?t:'dark');})();</script>
<link rel="manifest" href="pwa/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="pwa/favicon-32.png">
<link rel="apple-touch-icon" href="pwa/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A1060">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="dpw-shell.css">
<style>
/* Solo para la plantilla: contenido de ejemplo. Cada app conserva su propio CSS de contenido. */
body{margin:0;background:#0d0b28;color:#fff;font-family:'Barlow',sans-serif}
html[data-theme="light"] body{background:#F2F3F8;color:#1B1B2F}
.demo{max-width:1160px;margin:0 auto;padding:24px 16px}
.demo h1{font:800 28px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.5px;margin:0 0 6px}
.demo p{margin:0;opacity:.7}
</style>
</head>
<body>
<!-- LOGIN: frase de la app + escena animada propia + tarjeta blanca -->
<div class="dpw-login" id="dpwLogin">
  <button type="button" class="dpw-lg-install" data-dpw="instalar" hidden>Instalar app</button>
  <div class="dpw-lg-art" aria-hidden="true"><svg data-dpw-art></svg></div>
  <div class="dpw-lg-hero">
    <div class="dpw-lg-kick">DP World · Nombre de la app</div>
    <h1 class="dpw-lg-h1"><span>Primera</span> <span>línea de</span> <em>la frase.</em></h1>
    <p class="dpw-lg-lead">Una línea que diga qué resuelve la app.</p>
  </div>
  <svg class="dpw-lg-ground" data-dpw-ground aria-hidden="true"></svg>
  <div class="dpw-lg-card">
    <div class="dpw-lg-logo">
      <img src="assets/dpworld-logo-fondo-claro.png" alt="DP World">
      <div class="dpw-lg-app">Nombre de la app</div>
      <div class="dpw-lg-ref">DAL · Colón Logistics Park · Panamá</div>
    </div>
    <div class="dpw-lg-err" id="lgErr">Usuario o contraseña incorrectos</div>
    <form id="lgForm" novalidate>
      <div class="dpw-lg-fg"><label class="dpw-lg-lbl" for="lgUser">Usuario</label><input class="dpw-lg-in" id="lgUser" placeholder="Ingresa tu usuario" autocomplete="username"></div>
      <div class="dpw-lg-fg"><label class="dpw-lg-lbl" for="lgPass">Contraseña</label><input class="dpw-lg-in" id="lgPass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="dpw-lg-btn" type="submit">Ingresar</button>
    </form>
    <div class="dpw-lg-foot">Uso interno exclusivo · DP World Panamá</div>
  </div>
</div>

<!-- CINTA SUPERIOR -->
<header class="dpw-hdr">
  <div class="dpw-hdr-l">
    <button type="button" class="dpw-burger" data-dpw="menu" aria-label="Abrir menú" aria-expanded="false" aria-controls="dpwDrawer"><span></span><span></span><span></span></button>
    <div class="dpw-logo"><img src="assets/dpworld-logo-fondo-claro.png" alt="DP World"></div>
    <div><div class="dpw-title">DP WORLD</div><div class="dpw-sub" id="dpwSub">Nombre de la app</div></div>
  </div>
  <div class="dpw-hdr-r">
    <button type="button" class="dpw-hbtn dpw-install dpw-hide-sm" data-dpw="instalar" hidden>Instalar</button>
    <button type="button" class="dpw-hbtn" data-dpw="tema">Claro</button>
    <span class="dpw-role dpw-hide-sm">Supervisor</span>
    <button type="button" class="dpw-salir" id="salirBtn">Salir</button>
  </div>
</header>

<!-- MENÚ DESPLEGABLE -->
<div class="dpw-ov" id="dpwOv" data-dpw="menu-close" hidden></div>
<nav class="dpw-drawer" id="dpwDrawer" aria-label="Menú principal" aria-hidden="true">
  <div class="dpw-drawer-h"><div class="dpw-logo"><img src="assets/dpworld-logo-fondo-claro.png" alt="DP World"></div><div><div class="dpw-title">DP WORLD</div><div class="dpw-sub">Nombre de la app</div></div><button type="button" class="dpw-close" data-dpw="menu-close" aria-label="Cerrar menú">×</button></div>
  <div class="dpw-who" id="dpwWho"></div>
  <div class="dpw-items" id="dpwItems"></div>
  <div class="dpw-drawer-f"><span></span><button type="button" class="dpw-salir" id="salirBtn2">Salir</button></div>
</nav>

<main class="demo" id="vista"></main>

<script src="dpw-shell.js"></script>
<script src="dpw-escenas.js"></script>
<script src="dpw-mapa.js"></script>
<script>
// ?escena=bodega|patio|flujo|radar|mapa  ·  ?tema=light  ·  ?login=0 abre la app directo
// Tema e Instalar no necesitan código: los botones data-dpw los maneja dpw-shell.js
const q=new URLSearchParams(location.search),escena=q.get('escena')||'mapa';
if(q.get('tema'))DPW.ponerTema(q.get('tema'));
const login=document.getElementById('dpwLogin');
const vistas={inicio:'Inicio',reportes:'Reportes',insights:'Insights',tv:'Vista TV',config:'Configuración'};
let actual='inicio';
function pintar(){
  document.getElementById('vista').innerHTML='<h1>'+vistas[actual]+'</h1><p>Contenido de la sección.</p>';
  DPW.menu([
    {id:'inicio',label:'Inicio',on:()=>ir('inicio')},
    {id:'reportes',label:'Reportes',on:()=>ir('reportes')},
    {id:'insights',label:'Insights',badge:3,on:()=>ir('insights')},
    {id:'tv',label:'Vista TV',hint:'pantalla completa',on:()=>ir('tv')},
    {id:'config',label:'Configuración',group:'Administración',on:()=>ir('config')}
  ],actual);
  DPW.quien('Sesión','Supervisor · Turno A');
}
function ir(k){actual=k;pintar();}
document.getElementById('lgForm').onsubmit=e=>{e.preventDefault();login.hidden=true;pintar();};
['salirBtn','salirBtn2'].forEach(id=>document.getElementById(id).onclick=()=>{DPW.cerrarMenu();login.hidden=false;});
if(q.get('login')==='0'){login.hidden=true;}
pintar();
DPW.escena(escena,login);
DPW.pwa('pwa/sw.js');
</script>
</body>
</html>
